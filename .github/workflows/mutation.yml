name: Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install mutago
        # Pinned: mutation operators change between releases, so @latest can
        # move the gate repo-wide without any diff (v2.10.2 dropped covered
        # MSI from 82% to 79% here). Bump deliberately when raising the floor.
        run: go install github.com/quality-gates/mutago/v2/cmd/mutago@v2.10.1

      - name: Run mutation testing
        # --coverage profiles the package first; mutations on uncovered lines are
        # marked "not covered" and skipped rather than running the test suite against them.
        # --min-covered-msi enforces the quality gate on covered-code MSI.
        # --logger-github emits each escaped mutant as an inline PR annotation.
        # --exec-timeout caps each individual mutation run to 30 s.
        # Set to 94% to account for equivalent mutants in defensive codec error guards
        # (binary.Write to in-memory buffers cannot fail in practice).
        run: |
          mutago \
            --coverage \
            --min-covered-msi 80 \
            --logger-github \
            --exec-timeout 30 \
            ./...
