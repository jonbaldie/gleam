name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run linter
      run: |
        ./scripts/install-golangci-lint.sh
        GOTOOLCHAIN=go1.25.13 ./bin/golangci-lint run --build-tags=gms_pure_go ./...

    - name: Run all Go tests with Redis
      env:
        GLEAM_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      run: go test ./...

    - name: Build Docker image
      run: docker build -t jonbaldie/gleam .

    - name: Run Go tests
      run: docker run jonbaldie/gleam go test

    - name: Login to Docker Hub
      if: github.event_name == 'push' && success()
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Push image to Docker Hub
      if: github.event_name == 'push' && success()
      run: docker push jonbaldie/gleam:latest

  messgo:
    name: Run messgo quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Install messgo
        run: go install github.com/quality-gates/messgo/cmd/messgo@latest

      - name: Run messgo
        run: messgo . text codesize,design --ignore-tests
